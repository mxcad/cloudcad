# 梦想网页CAD实时协同平台 Nginx L2 缓存配置
# 与 URL 缓存破坏模式（?t=&v=）配合使用
#
# 部署: 将此文件放入 /etc/nginx/conf.d/cloudcad-cache.conf
# 或 include 到你的站点配置中
#
# 缓存原理:
# - ?t=updatedAt&v=version 作为唯一缓存的键
# - 文件更新时后端返回新的 ?t= 值，Nginx 视为新 URL
# - 无需 PURGE 或手动缓存失效

proxy_cache_path /var/cache/nginx/cloudcad levels=1:2
                 keys_zone=cloudcad:10m
                 max_size=10g
                 inactive=60m
                 use_temp_path=off;

# 后端 API 上游（NestJS）
upstream backend {
    server 127.0.0.1:3001;
    keepalive 64;
}

# 转换服务上游
upstream conversion-service {
    server 127.0.0.1:3100;
}

# 文件存储服务上游
upstream storage-service {
    server 127.0.0.1:3200;
}

server {
    listen 80;
    server_name cloudcad.example.com;

    # ---------- 静态资源 / 前端 ----------
    root /opt/cloudcad/frontend/dist;
    index index.html;

    # 前端静态资源: 文件名含 hash, 永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 回退: index.html 不缓存
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store";
    }

    # ---------- 文件数据（L2 缓存层）----------
    # 文件 URL 格式: /api/v1/mxcad/filesData/*path?t=timestamp&v=version
    # ?t= 和 ?v= 参数使 Nginx 将每次文件变更视为新 URL
    location /api/v1/mxcad/filesData/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # L2 缓存: 以完整 URL（含查询参数）为缓存键
        proxy_cache cloudcad;
        proxy_cache_key $scheme$proxy_host$uri$is_args$args;
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 1m;

        # 当后端返回特定 header 时绕过缓存
        proxy_cache_bypass $http_x_purge_cache;

        # 向后端透传原始查询参数（?t= 和 ?v=）
        proxy_set_header X-Original-URL $request_uri;

        # 缓存命中时添加 header 便于调试
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ---------- 后端 API（不缓存）----------
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API 响应不缓存
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ---------- WebSocket（协同）----------
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # ---------- 文件存储服务（独立模式）----------
    location /storage/ {
        proxy_pass http://storage-service/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 文件存储也可通过 Nginx 缓存
        proxy_cache cloudcad;
        proxy_cache_key $scheme$proxy_host$uri$is_args$args;
        proxy_cache_valid 200 1h;

        add_header X-Cache-Status $upstream_cache_status;
    }

    # ---------- 转换服务（不缓存）----------
    location /conversion-service/ {
        proxy_pass http://conversion-service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ---------- 健康检查 ----------
    location /health {
        access_log off;
        return 200 "OK\n";
    }
}

# 缓存清除端点（可选）
# 请求: curl -X PURGE http://cloudcad.example.com/api/v1/mxcad/filesData/...
# location ~ /api/v1/mxcad/filesData/.* {
#     limit_except PURGE { deny all; }
#     proxy_cache_purge cloudcad $scheme$proxy_host$uri$is_args$args;
# }
