# fail2ban SSH jail 配置模板（#418 边界防护 / #407 决策执行）
# 由 install-fail2ban.sh 渲染到 /etc/fail2ban/jail.d/sshd.local。
#
# 设计：
# - 仅启用 sshd jail，起步最小化；443 公网 TLS 落地后再扩展 web jail（nginx-http-auth / nginx-botsearch）。
# - 连续 maxretry 次失败 → 封禁 banaction 时长。
# - 封禁动作按发行版可用性选择：优先 nftables，回退 iptables-multiport。
# - 日志路径按发行版适配（Debian/Ubuntu=auth.log，RHEL/rocky=secure）。
#
# 参数可通过环境变量覆盖（install-fail2ban.sh 读取）：
#   F2B_MAXRETRY      失败次数阈值（默认 5）
#   F2B_FINDTIME      失败计数窗口秒（默认 600 = 10 分钟）
#   F2B_BANTIME       封禁时长秒（默认 3600 = 1 小时）
#   F2B_LOGPATH       sshd 失败日志路径（默认按发行版探测）

[sshd]
enabled = true
port = 22
filter = sshd
logpath = %LOGPATH%
maxretry = %MAXRETRY%
findtime = %FINDTIME%
bantime = %BANTIME%
banaction = %BANACTION%
ignoreip = 127.0.0.1/8 ::1
