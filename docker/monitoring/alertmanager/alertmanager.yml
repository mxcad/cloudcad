# 梦想网页CAD实时协同平台 Alertmanager 配置（ADR-0055 §4）
# SMTP 接收人 + 按 severity 分组路由；指标告警直接邮件（与业务 AlertService 两套独立）。
# SMTP 连接串由 docker-compose.monitoring.yml 注入环境变量生成（SMTP_SMARTHOST）。

route:
  receiver: 'email-default'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  # 按 severity 分级（P0 立即 / P1 15min 聚合 / P2 日报，#316）
  routes:
    - matchers:
        - severity =~ "critical|P0"
      receiver: 'email-p0'
      group_wait: 10s      # P0 立即外发（仅留短窗口去重抖动）
      repeat_interval: 15m
    - matchers:
        - severity =~ "warning|P1"
      receiver: 'email-p1'
      group_wait: 15m      # P1 聚合窗口与 AlertService P1 15min 语义对齐
      group_interval: 15m
    - matchers:
        - severity =~ "info|P2"
      receiver: 'email-p2'
      group_wait: 8h       # P2 日报风格

# 抑制规则：磁盘告警期间抑制同实例衍生告警（磁盘满导致的 CPU/内存/5xx 噪声）
inhibit_rules:
  - source_matchers:
      - alertname = HostDiskSpaceLow
    target_matchers:
      - alertname =~ "HostCpuUsageHigh|HostMemoryUsageHigh|HttpServerErrorRateHigh|HttpP99LatencyHigh"
    equal: ['instance']

receivers:
  - name: 'email-default'
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        from: '${SMTP_FROM}'
        smarthost: '${SMTP_SMARTHOST}'
        auth_username: '${SMTP_AUTH_USERNAME}'
        auth_password: '${SMTP_AUTH_PASSWORD}'
        require_tls: true
        send_resolved: true
  - name: 'email-p0'
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        from: '${SMTP_FROM}'
        smarthost: '${SMTP_SMARTHOST}'
        auth_username: '${SMTP_AUTH_USERNAME}'
        auth_password: '${SMTP_AUTH_PASSWORD}'
        require_tls: true
        send_resolved: true
  - name: 'email-p1'
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        from: '${SMTP_FROM}'
        smarthost: '${SMTP_SMARTHOST}'
        auth_username: '${SMTP_AUTH_USERNAME}'
        auth_password: '${SMTP_AUTH_PASSWORD}'
        require_tls: true
        send_resolved: true
  - name: 'email-p2'
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        from: '${SMTP_FROM}'
        smarthost: '${SMTP_SMARTHOST}'
        auth_username: '${SMTP_AUTH_USERNAME}'
        auth_password: '${SMTP_AUTH_PASSWORD}'
        require_tls: true
        send_resolved: true
