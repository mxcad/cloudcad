# 梦想网页CAD实时协同平台 Nginx 配置 v2 — TLS 变体（#408 公网 TLS）
# 由 docker-entrypoint.sh 在 TLS_CERT_PATH/TLS_KEY_PATH 均配置且文件存在时选用：
#   443 提供 https（TLS1.2/1.3），80 一律 301 跳转 https。
# 占位符（entrypoint sed 渲染）：__MOBILE_PATH__ / __TLS_CERT_PATH__ / __TLS_KEY_PATH__
# 未配置证书时 entrypoint 改用同目录 nginx.conf（纯 HTTP 变体），本文件不会被加载。

# 后端上游
upstream backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # http2 on 需 nginx >= 1.25.1（当前基础镜像 alpine 3.22 提供 1.28.x；降级基础镜像时注意）
    http2 on;
    server_name _;

    # TLS 证书（路径由部署 env TLS_CERT_PATH/TLS_KEY_PATH 渲染，证书文件挂载至 /etc/nginx/certs/）
    ssl_certificate __TLS_CERT_PATH__;
    ssl_certificate_key __TLS_KEY_PATH__;
    # 等保 8.1.4.2 传输保密性/完整性：仅 TLS1.2/1.3 + 强密码组
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    # 会话缓存复用镜像主配置默认值（ssl_session_cache shared:SSL:2m / timeout 1h / tickets off），
    # 同名 zone 重复声明会报 size conflicts，故此处不再覆盖

    # 全局上传大小限制（必须放在 server 块内）
    # 设置足够大的值，实际限制由后端运行时配置 maxFileSize 控制
    client_max_body_size 512M;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS：SPA 主文档由 nginx 直出、不经后端 helmet，须在此下发（参数与后端 helmet 一致：
    # max-age=31536000 / includeSubDomains / preload），否则首访浏览器未注册 HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/pdf image/svg+xml;
    gzip_disable "msie6";

    # 静态文件目录
    root /var/www/html;
    index index.html;

    # mxcad-app 运行时原样 dist（index.js、chunks/、styles/ 均无 hash），部署模型是
    # 「覆盖服务器 mxcad-app/ 目录即热更新」，故按校验下发而非强缓存：强缓存会让已访问
    # 用户拿到旧入口且 immutable 禁止回源校验，覆盖更新永久不可见。^~ 阻止下方静态
    # 资源 regex location 命中并覆盖安全头（location 内 add_header 会整体替换 server
    # 级 add_header，故此处显式重列）
    location ^~ /mxcad-app/ {
        expires off;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # 静态文件缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API 代理到后端（/api/cooperate 为 HTTP 转发至协同服务 3091，与 HTTP 变体一致）
    location /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Connection 置空：配合 upstream keepalive 32 复用上游连接（与 HTTP 变体一致）
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 大文件上传支持
        client_max_body_size 512M;
        client_body_buffer_size 128k;
    }

    # MxCAD 文件服务代理 (精确匹配 /mxcad/ 开头的路径)
    location /mxcad/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Connection 置空：配合 upstream keepalive 32 复用上游连接（与 /api 一致）
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 健康检查 (代理到后端)
    location /health {
        access_log off;
        proxy_pass http://backend/api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # 移动端页面 (SPA，从配置的路径提供)
    location /__MOBILE_PATH__ {
        alias /var/www/html/__MOBILE_PATH__;
        try_files $uri $uri/ /__MOBILE_PATH__/index.html;
    }

    # SPA 路由（所有未匹配的请求返回 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/html;
    }
}

# HTTP → HTTPS 强制跳转（HSTS 由后端 helmet 下发，浏览器二次访问直接 https）
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}
