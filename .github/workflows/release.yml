name: 发布 Release

# 只有维护者打 v* 标签才触发发布；workflow_dispatch 允许手动重跑（如 mxcad 上传后补合并）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '手动触发对应的 Release tag（如 v2.3.1）'
        required: true

# 统一推导当前发布的 tag 名：push tag 用 ref_name，workflow_dispatch 用输入
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  MXCAD_REPO: mxcad/cloudcad
  MXCAD_TAG: mxcad-stable

permissions:
  contents: write

jobs:
  # ============================================================
  # 动态发现 Linux 架构清单（从 mxcad-dist/manifest.json）
  # ============================================================
  detect-arch:
    runs-on: ubuntu-latest
    outputs:
      linux-arch: ${{ steps.detect.outputs.linux_arch }}
    steps:
      - uses: actions/checkout@v4
      - name: 从 manifest.json 发现 Linux 架构
        id: detect
        run: |
          if [ -f mxcad-dist/manifest.json ]; then
            archs=$(node -e "
              const m = require('./mxcad-dist/manifest.json');
              const set = new Set();
              for (const k of Object.keys(m)) if (m[k].platform === 'linux') set.add(m[k].arch);
              console.log(JSON.stringify([...set].sort()));
            ")
          else
            archs='["x86_64"]'
          fi
          echo "linux_arch=${archs}" >> "$GITHUB_OUTPUT"
          echo "检测到 Linux 架构: ${archs}"

  # ============================================================
  # Linux 部署包：Docker + QEMU 多架构构建
  # ============================================================
  build-linux:
    name: Linux (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: detect-arch
    strategy:
      fail-fast: false
      matrix:
        os: [centos7, ubuntu22, ubuntu24, rocky8, rocky9, debian]
        arch: ${{ fromJSON(needs.detect-arch.outputs.linux-arch) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - uses: pnpm/action-setup@v2
        with:
          version: 9.15.9

      # 若需 arm 架构，启用 QEMU 模拟（GitHub 无免费 arm runner）
      # - name: 设置 QEMU 多架构模拟
      #   uses: docker/setup-qemu-action@v3

      # 安装依赖（pack-linux-deploy.js 会在本机构建前端，这里只需装齐依赖）
      - run: pnpm install --frozen-lockfile

      # 从 manifest.json 下载本架构所有产品二进制（mxcad），解压到 runtime/linux/<component>
      - name: 下载产品二进制
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          mkdir -p runtime/linux
          # 从 manifest.json 提取该架构的所有组件附件名
          mapfile -t assets < <(node -e "
            const m = require('./mxcad-dist/manifest.json');
            for (const k of Object.keys(m)) {
              const e = m[k];
              if (e.platform === 'linux' && e.arch === '${arch}') console.log(e.asset);
            }
          ")
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::manifest 中未找到 linux-${arch} 的产物，请先运行 scripts/upload-mxcad.js"
            exit 1
          fi
          for asset in "${assets[@]}"; do
            comp="${asset%%-*}"
            echo "下载: $asset (→ runtime/linux/$comp)"
            gh release download "$MXCAD_TAG" --repo "$MXCAD_REPO" --pattern "$asset" --dir /tmp/dl --clobber
            mkdir -p "runtime/linux/$comp"
            case "$asset" in
              *.zip) unzip -o "/tmp/dl/$asset" -d "runtime/linux/$comp" ;;
              *.7z)  7z x -y "/tmp/dl/$asset" -o"runtime/linux/$comp" ;;
              *)     tar -xzf "/tmp/dl/$asset" -C "runtime/linux/$comp" ;;
            esac
            # 部分 mxcad tar.gz 顶层是 .tmp-<name>/ 嵌套目录（本地 upload-mxcad.js 上传时的打包结构），
            # 需把该嵌套层的内容提升到 runtime/linux/<comp>/ 根，否则 SystemLib 等落在子目录，
            # 后续 Dockerfile 的 COPY + SystemLib 覆盖会因路径不对而失败（ubuntu22/24 已复现）。
            # 若无 .tmp-* 嵌套（如多文件散包）则不动。
            tmp_dirs=$(find "runtime/linux/$comp" -maxdepth 1 -mindepth 1 -type d -name '.tmp-*' | head -1)
            if [ -n "$tmp_dirs" ]; then
              echo "检测到嵌套目录 $tmp_dirs，提升到 runtime/linux/$comp/ ..."
              shopt -s dotglob
              mv "$tmp_dirs"/* "runtime/linux/$comp/" 2>/dev/null || true
              shopt -u dotglob
              rmdir "$tmp_dirs" 2>/dev/null || true
            fi
          done

      # 用 Docker 打包 Linux 部署包（QEMU/多架构见上方注释）
      - name: 打包 Linux 部署包
        env:
          CI: 'true'
        run: node scripts/pack-linux-deploy.js --os "${{ matrix.os }}"

      # 上传产物到 Release（同名 Release 已存在则追加产物）
      - name: 上传产物到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*.tar.gz
          draft: true

  # ============================================================
  # Windows 部署包：官方源构建标准组件 + mxcad 合并
  # ============================================================
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - uses: pnpm/action-setup@v2
        with:
          version: 9.15.9

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cloudcad/db build
      - run: pnpm --filter @cloudcad/contracts build
      - run: pnpm build
        working-directory: packages/frontend
      - run: pnpm build
        working-directory: packages/frontend_mobile

      # 从 manifest.json 下载 windows-x64 的所有产品二进制（mxcad/mxversion）
      - name: 下载产品二进制
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p runtime/windows
          # 从 manifest.json 提取 windows-x64 的所有组件附件名
          mapfile -t assets < <(node -e "
            const m = require('./mxcad-dist/manifest.json');
            for (const k of Object.keys(m)) {
              const e = m[k];
              if (e.platform === 'windows' && e.arch === 'x64') console.log(e.asset);
            }
          ")
          for asset in "${assets[@]}"; do
            comp="${asset%%-*}"
            echo "下载: $asset (→ runtime/windows/$comp)"
            gh release download "$MXCAD_TAG" --repo "$MXCAD_REPO" --pattern "$asset" --dir /tmp/dl --clobber
            mkdir -p "runtime/windows/$comp"
            case "$asset" in
              *.zip)
                # mxcad.zip 内部路径用反斜杠，unzip 会报 "backslashes as path separators"
                # warning 并返回非零退出码，bash -e 下会误判失败。容忍退出码但用下方校验兜底。
                unzip -o "/tmp/dl/$asset" -d "runtime/windows/$comp" || true
                ;;
              *.7z)  7z x -y "/tmp/dl/$asset" -o"runtime/windows/$comp" ;;
              *)     tar -xzf "/tmp/dl/$asset" -C "runtime/windows/$comp" ;;
            esac
            # 校验解压产物非空，防止 unzip warning 掩盖真实解压失败
            if [ "$(find "runtime/windows/$comp" -type f | wc -l)" -eq 0 ]; then
              echo "::error::解压后 $comp 目录为空，下载/解压失败: $asset"
              exit 1
            fi
          done
          echo "产品二进制已就绪"

      # 构建 Windows 标准组件（node/pg/redis 官方源）
      - name: 构建 Windows 标准组件
        run: node scripts/build-windows-runtime.js

      # 打包 Windows 部署包
      - name: 打包 Windows 部署包
        shell: bash
        env:
          CI: 'true'
        run: node scripts/pack-offline.js --deploy --win

      # 上传产物到 Release（同名 Release 已存在则追加产物）
      - name: 上传产物到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*.7z
          draft: true

  # ============================================================
  # Release 汇总（可选）：Linux + Windows 产物合并确认
  # ============================================================
  # 由于 Linux/Windows job 各自 upload-artifact 到软 props，此 job 可用于
  # 通知/校验，此处保留为占位，实际由 softprops 直接上传。
