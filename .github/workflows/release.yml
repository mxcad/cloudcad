name: 发布 Release

# 只有维护者打 v* 标签才触发发布；workflow_dispatch 允许手动重跑（如 mxcad 上传后补合并）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '手动触发对应的 Release tag（如 v2.3.1）'
        required: true

# 统一推导当前发布的 tag 名：push tag 用 ref_name，workflow_dispatch 用输入
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  MXCAD_REPO: mxcad/cloudcad
  MXCAD_TAG: mxcad-stable

permissions:
  contents: write

jobs:
  # ============================================================
  # 动态发现 Linux 架构清单（从 scripts/pack-lib/mxcad-registry.json）
  # ============================================================
  detect-arch:
    runs-on: ubuntu-latest
    outputs:
      linux-arch: ${{ steps.detect.outputs.linux_arch }}
    steps:
      - uses: actions/checkout@v4
      - name: 从 mxcad-registry.json 发现 Linux 架构
        id: detect
        run: |
          if [ -f scripts/pack-lib/mxcad-registry.json ]; then
            archs=$(node -e "
              const m = require('./scripts/pack-lib/mxcad-registry.json');
              const set = new Set();
              for (const k of Object.keys(m)) if (m[k].platform === 'linux') set.add(m[k].arch);
              console.log(JSON.stringify([...set].sort()));
            ")
          else
            archs='["x86_64"]'
          fi
          echo "linux_arch=${archs}" >> "$GITHUB_OUTPUT"
          echo "检测到 Linux 架构: ${archs}"

  # ============================================================
  # Linux 部署包：Docker + QEMU 多架构构建
  # ============================================================
  build-linux:
    name: Linux (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: detect-arch
    strategy:
      fail-fast: false
      matrix:
        # ADR-0059 决策 2：发行版收敛到 3 个 glibc 档位（centos7/ubuntu22/rocky9），
        # 砍掉 ubuntu24/rocky8/debian（glibc 与三档重叠或可被代表）
        os: [centos7, ubuntu22, rocky9]
        arch: ${{ fromJSON(needs.detect-arch.outputs.linux-arch) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - uses: pnpm/action-setup@v2
        with:
          version: 9.15.9

      # 缓存 pnpm store（key 含 lockfile 哈希）：依赖未增减时后续发版零下载。
      # 与 ci.yml 对齐——此前 release 两个 job 都无缓存，每次发版重下全量依赖 + 产品二进制。
      - name: 获取 pnpm 存储目录
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 设置 pnpm 缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 若需 arm 架构，启用 QEMU 模拟（GitHub 无免费 arm runner）
      # - name: 设置 QEMU 多架构模拟
      #   uses: docker/setup-qemu-action@v3

      # 安装依赖（pack-linux-deploy.js 会在本机构建前端，这里只需装齐依赖）
      - run: pnpm install --frozen-lockfile

      # 从 mxcad-registry.json 下载本架构所有产品二进制（mxcad），解压到 runtime/linux/<component>
      - name: 下载产品二进制
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          mkdir -p runtime/linux
          # 从 mxcad-registry.json 提取该架构的所有组件附件名
          mapfile -t assets < <(node -e "
            const m = require('./scripts/pack-lib/mxcad-registry.json');
            for (const k of Object.keys(m)) {
              const e = m[k];
              if (e.platform === 'linux' && e.arch === '${arch}') console.log(e.asset);
            }
          ")
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::registry 中未找到 linux-${arch} 的产物，请先运行 scripts/upload-mxcad.js"
            exit 1
          fi
          for asset in "${assets[@]}"; do
            comp="${asset%%-*}"
            echo "下载: $asset (→ runtime/linux/$comp)"
            gh release download "$MXCAD_TAG" --repo "$MXCAD_REPO" --pattern "$asset" --dir /tmp/dl --clobber
            mkdir -p "runtime/linux/$comp"
            case "$asset" in
              *.zip) unzip -o "/tmp/dl/$asset" -d "runtime/linux/$comp" ;;
              *.7z)  7z x -y "/tmp/dl/$asset" -o"runtime/linux/$comp" ;;
              *)     tar -xzf "/tmp/dl/$asset" -C "runtime/linux/$comp" ;;
            esac
            # 部分 mxcad tar.gz 顶层是 .tmp-<name>/ 嵌套目录（本地 upload-mxcad.js 上传时的打包结构），
            # 需把该嵌套层的内容提升到 runtime/linux/<comp>/ 根，否则 SystemLib 等落在子目录，
            # 后续 Dockerfile 的 COPY + SystemLib 覆盖会因路径不对而失败（ubuntu22/24 已复现）。
            # 若无 .tmp-* 嵌套（如多文件散包）则不动。
            tmp_dirs=$(find "runtime/linux/$comp" -maxdepth 1 -mindepth 1 -type d -name '.tmp-*' | head -1)
            if [ -n "$tmp_dirs" ]; then
              echo "检测到嵌套目录 $tmp_dirs，提升到 runtime/linux/$comp/ ..."
              shopt -s dotglob
              mv "$tmp_dirs"/* "runtime/linux/$comp/" 2>/dev/null || true
              shopt -u dotglob
              rmdir "$tmp_dirs" 2>/dev/null || true
            fi
          done

      # 平台物料（node/postgres/redis/subversion）复用层：容器挂载空缓存时由
      # extract-linux-runtime.js 自提（apt/dnf/yum install + 收集依赖库）并落盘，
      # pack-linux-deploy.js 打包前后各做一次关键文件检查——缺失自动重提、重提失败 fail-fast。
      # 原「下载 runtime 依赖包」步骤已删除：runtime-deps Release tag 从未发布（404），
      # 该步骤 .catch→exit 1 会让每次打 Linux 部署包必失败；复用职责下沉到 CI cache。
      # key 含组件版本源码哈希——node/pg/redis 升级 → 哈希变 → 缓存自然失效重提。
      - name: 设置 Linux 平台物料缓存
        uses: actions/cache@v4
        with:
          path: runtime/cache/linux-extract/${{ matrix.os }}
          key: ${{ runner.os }}-linux-extract-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/pack-lib/component-versions.js') }}
          restore-keys: |
            ${{ runner.os }}-linux-extract-${{ matrix.os }}-${{ matrix.arch }}-

      # 用 Docker 打包 Linux 部署包（QEMU/多架构见上方注释）
      - name: 打包 Linux 部署包
        env:
          CI: 'true'
        run: node scripts/pack-linux-deploy.js --os "${{ matrix.os }}"

      # ADR-0059 决策 8：断网启动验证硬门禁——docker run --network none 在发行版匹配的基础镜像内
      # 解压包 + 启动全服务（postgres/redis/backend/frontend/cooperate/config-service）+ 健康检查。
      # 验证失败 → 本 job 失败 → 下方上传步骤不执行（draft Release 只含验证过的包）。
      - name: 断网启动验证（--network none，验证通过才上传）
        env:
          CI: 'true'
        run: node scripts/verify-linux-deploy.js --os "${{ matrix.os }}"

      # 上传产物到 Release（同名 Release 已存在则追加产物）
      - name: 上传产物到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*.tar.gz
          draft: true

  # ============================================================
  # Windows 部署包：官方源构建标准组件 + mxcad 合并
  # ============================================================
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - uses: pnpm/action-setup@v2
        with:
          version: 9.15.9

      # 缓存 pnpm store（与 ci.yml / 上方 Linux job 对齐）
      - name: 获取 pnpm 存储目录
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 设置 pnpm 缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cloudcad/db build
      - run: pnpm --filter @cloudcad/contracts build
      - run: pnpm build
        working-directory: packages/frontend
      - run: pnpm build
        working-directory: packages/frontend_mobile

      # 从 mxcad-registry.json 下载 windows-x64 的所有产品二进制（mxcad/mxversion/postgresql）
      # postgresql 自 2026-08 起走产品二进制通道（EDB 官方直链已 403），
      # zip 顶层须为 pgsql/ 目录，解压后落在 runtime/windows/postgresql/pgsql/
      - name: 下载产品二进制
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p runtime/windows
          # 从 mxcad-registry.json 提取 windows-x64 的所有组件附件名
          mapfile -t assets < <(node -e "
            const m = require('./scripts/pack-lib/mxcad-registry.json');
            for (const k of Object.keys(m)) {
              const e = m[k];
              if (e.platform === 'windows' && e.arch === 'x64') console.log(e.asset);
            }
          ")
          # 与 build-linux 的空 assets 守卫对齐：registry 缺条目时静默空转，
          # 直到末尾断言才炸，报错却指向 upload-mxcad.js 而非真因
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::registry 中未找到 windows-x64 的产物，请先运行 scripts/upload-mxcad.js"
            exit 1
          fi
          for asset in "${assets[@]}"; do
            comp="${asset%%-*}"
            echo "下载: $asset (→ runtime/windows/$comp)"
            gh release download "$MXCAD_TAG" --repo "$MXCAD_REPO" --pattern "$asset" --dir /tmp/dl --clobber
            mkdir -p "runtime/windows/$comp"
            case "$asset" in
              *.zip)
                # mxcad.zip 内部路径用反斜杠，unzip 会报 "backslashes as path separators"
                # warning 并返回非零退出码，bash -e 下会误判失败。容忍退出码但用下方校验兜底。
                unzip -o "/tmp/dl/$asset" -d "runtime/windows/$comp" || true
                ;;
              *.7z)  7z x -y "/tmp/dl/$asset" -o"runtime/windows/$comp" ;;
              *)     tar -xzf "/tmp/dl/$asset" -C "runtime/windows/$comp" ;;
            esac
            # 校验解压产物非空，防止 unzip warning 掩盖真实解压失败
            if [ "$(find "runtime/windows/$comp" -type f | wc -l)" -eq 0 ]; then
              echo "::error::解压后 $comp 目录为空，下载/解压失败: $asset"
              exit 1
            fi
          done
          echo "产品二进制已就绪"

      # 构建 Windows 标准组件（node/redis 官方源；postgresql 已移入上方产品二进制通道）。
      # 脚本为 fail-fast：任一组件下载/解压失败即退出非零，并在结尾断言三组件就绪。
      - name: 构建 Windows 标准组件
        run: node scripts/build-windows-runtime.js

      # 生成生产依赖离线 store（Windows 不走 Docker，须本机构建 .pnpm-store-deploy，
      # 否则 pack-offline.js 的 prepareDeployStore 会因 store 缺失报 "Docker store 缺失"）
      # filter 清单必须与 scripts/pack-offline.js 的 getDeployStoreInstallFilter 逐字一致
      # （ADR-0069：少 filter 一个包 → 目标机 --prod 装不出它的 workspace 链接 → dist 里的
      # require 解析失败）。此前这里漏了 engine-exec / conversion-service。
      - name: 生成生产依赖 store
        run: pnpm --filter backend --filter @cloudcad/db --filter @cloudcad/contracts --filter @cloudcad/engine-exec --filter @cloudcad/conversion-service install --frozen-lockfile --prod --store-dir .pnpm-store-deploy

      # 打包 Windows 部署包
      - name: 打包 Windows 部署包
        shell: bash
        env:
          CI: 'true'
        run: node scripts/pack-offline.js --deploy --win

      # ADR-0059 决策 8：Windows 断网启动验证硬门禁——docker run --network none 在 servercore 容器内
      # 解压 .7z + 内嵌 node 跑 verify-deploy.js（启动全服务 + 健康检查）。
      # 验证失败 → 本 job 失败 → 不上传。注意：GH windows-latest 跑 Windows 容器可能慢/不稳，
      # 降级路径见 ADR-0059（Linux 硬门禁 + Windows 手动验证）。
      - name: Windows 断网启动验证（--network none，验证通过才上传）
        env:
          CI: 'true'
        run: node scripts/verify-windows-deploy.js

      # 上传产物到 Release（同名 Release 已存在则追加产物）
      - name: 上传产物到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*.7z
          draft: true

  # ============================================================
  # Linux Docker 一键部署包（ADR-0075 C9 / ADR-0074 半容器化）
  # ubuntu-latest x86_64 出 x86_64 包；aarch64 保持本地打包机（R2：
  # mxcad-stable 无 ARM 资产，阻塞与裸机一致）。pack-linux-docker.js 自举
  # 物料（node/mxcad/docker 静态二进制/镜像），--verify 走 DinD 断网硬门禁，
  # 验证通过（本 step 成功）才执行下方上传 step。
  # ============================================================
  build-linux-docker:
    name: Linux Docker x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - uses: pnpm/action-setup@v2
        with:
          version: 9.15.9

      # 缓存 pnpm store（与 build-linux / build-windows 对齐）
      - name: 获取 pnpm 存储目录
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 设置 pnpm 缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 安装依赖（preinstall 顺带下载 x86_64 产品二进制 mxcad 到 runtime/linux/，
      # pack-linux-docker.js 物料解析优先命中本地，免重复走 Release 下载）
      - run: pnpm install --frozen-lockfile

      # 打包 + DinD 断网验证（pack-linux-docker.js --verify：step8 调
      # verify-linux-docker-deploy.js，45 分钟总超时）。验证失败 → 本 step 失败 →
      # 下方上传 step 不执行（draft Release 只含验证过的包）。
      # 超时预算放宽（R1：GH ubuntu runner 上 app 镜像 build + save 30-60 分钟级，
      # 叠加 verify 45 分钟）。
      - name: 打包 Linux Docker 部署包 + 断网验证（验证通过才上传）
        env:
          CI: 'true'
        timeout-minutes: 180
        run: node scripts/pack-linux-docker.js --verify

      # 上传产物到 Release（同名 Release 已存在则追加产物）。
      # 只挑 docker 形态包（-docker- 段，C2 命名），与裸机 linux 包（build-linux job）区分。
      - name: 上传产物到 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*-docker-linux-*.tar.gz
          draft: true

  # ============================================================
  # Windows 宿主 Docker 一键部署包（ADR-0075 C9 v2 / #440 + #444）
  # windows-latest x64（自带 Docker Desktop，WSL2 跑 linux 容器）出 x86_64 包。
  # pack-linux-docker.js 自举宿主物料（node 走 build-windows-runtime.js、mxcad 走
  # Release 下载兜底），Docker Desktop 构建 app 镜像，7-Zip 归档 .7z；--verify 走
  # verify-windows-docker.js（start.bat E2E + 宿主侧二次探针 + stop.bat——部署横跨
  # 宿主进程 + WSL2 VM，无法 --network none 断网，门禁语义见 #444）。
  # 验证通过（本 step 成功）才执行下方上传 step。
  # ============================================================
  build-windows-docker:
    name: Windows 宿主 Docker x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - uses: pnpm/action-setup@v2
        with:
          version: 9.15.9

      # 缓存 pnpm store（与 build-linux / build-windows / build-linux-docker 对齐）
      - name: 获取 pnpm 存储目录
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 设置 pnpm 缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # app 镜像消费两端前端 dist（Dockerfile.app production 阶段），须先构建
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cloudcad/db build
      - run: pnpm --filter @cloudcad/contracts build
      - run: pnpm build
        working-directory: packages/frontend
      - run: pnpm build
        working-directory: packages/frontend_mobile

      # app 镜像是 linux 镜像：Docker Desktop 必须处于 Linux 容器模式。runner 若处于
      # Windows 容器模式则切 desktop-linux context；切不过去即明确失败（非静默跳过）。
      - name: 确保 Docker 处于 Linux 容器模式
        shell: bash
        run: |
          mode=$(docker info --format '{{.OSType}}')
          echo "Docker OSType: $mode"
          if [ "$mode" != "linux" ]; then
            docker context use desktop-linux || {
              echo "::error::Docker 处于 Windows 容器模式且无法切换到 desktop-linux（本 job 需要 Linux 容器）"
              exit 1
            }
            mode=$(docker info --format '{{.OSType}}')
            if [ "$mode" != "linux" ]; then
              echo "::error::切换后仍非 Linux 容器模式: $mode"
              exit 1
            fi
          fi

      # 打包 + Windows 宿主验证（pack-linux-docker.js --host-platform windows --verify：
      # step8 调 verify-windows-docker.js——start.bat E2E（12 步含包内 13 项验证）+
      # 宿主侧二次探针 + stop.bat；verify 脚本自身 start 45 分钟 + stop 15 分钟总超时）。
      # 验证失败 → 本 step 失败 → 下方上传 step 不执行（draft Release 只含验证过的包）。
      # 超时预算：app 镜像 build（Docker Desktop WSL2，30-60 分钟级）+ 镜像 save +
      # 归档 + verify（最长 ~60 分钟）。
      - name: 打包 Windows 宿主 Docker 部署包 + 验证（验证通过才上传）
        env:
          CI: 'true'
        timeout-minutes: 240
        run: node scripts/pack-linux-docker.js --host-platform windows --verify

      # 上传产物到 Release（同名 Release 已存在则追加产物）。
      # 只挑 docker 形态 windows 宿主包（-docker- 段，C2 命名），
      # 与裸机 windows 包（build-windows job 的 release/*.7z）区分。
      - name: 上传产物到 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*-docker-windows-*.7z
          draft: true

  # ============================================================
  # Release 汇总（可选）：Linux + Windows 产物合并确认
  # ============================================================
  # 由于 Linux/Windows job 各自 upload-artifact 到软 props，此 job 可用于
  # 通知/校验，此处保留为占位，实际由 softprops 直接上传。
